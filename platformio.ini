; Default environment settings
[platformio]
default_envs = waveshare-esp32s3-touch-amoled-164

[env:waveshare-esp32s3-touch-amoled-164]
# Pin to pioarduino fork platform 55.03.32, which ships ESP-IDF v5.5.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
#platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Hardware, debug and mock switches only affect the firmware sources. Everything
; else - CPU, PSRAM, partitions, BLE, TLS - lives in sdkconfig.defaults.
build_flags =
    -Ofast
    -Wall

extra_scripts =
    tools/build-scripts/pre_build.py
    tools/build-scripts/post_build.py
    tools/build-scripts/custom_targets.py

build_src_filter = +<*> -<.git/> -<.svn/>

; Custom partition table for delta OTA updates
board_build.partitions = partitions.csv

; Upload via USB settings
upload_speed = 921600
; upload_port = /dev/cu.usbmodem*

; Monitor settings
monitor_speed = 115200
; monitor_port = /dev/cu.usbmodem*

[env:waveshare-esp32s3-touch-amoled-164-debug]
extends = env:waveshare-esp32s3-touch-amoled-164
build_type = debug
build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DUI_DEBUG_SERIAL_DELAY_MS=2000
custom_sdkconfig =
    CONFIG_LOG_DEFAULT_LEVEL_INFO=y

; Suppress touch controller I2C logs. We have to poll the touchscreen because it
; does not support interrupts, and idle polls NACK.
monitor_filters = esp32_exception_decoder, default, hiding_filter

[env:waveshare-esp32s3-touch-amoled-164-v2]
extends = env:waveshare-esp32s3-touch-amoled-164
build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DHW_DISPLAY_VARIANT_V2=1

[env:waveshare-esp32s3-touch-amoled-164-mock]
extends = env:waveshare-esp32s3-touch-amoled-164-debug

build_flags =
    ${env:waveshare-esp32s3-touch-amoled-164.build_flags}
    -DMOCK_BUILD
    -DDEBUG_ENABLE_LOADCELL_MOCK=1
    -DDEBUG_ENABLE_GRINDER_BACKGROUND_INDICATOR=1
